  search_intro_title: "Was ist Bundessuche?"
  search_intro_project_html: >-
    Bundessuche ist ein Projekt von <a href="https://emi.industries">Michael Emhofer</a>
    und bietet eine einfache und schnelle Möglichkeit, die Bestände des Bundesarchivs zu durchsuchen.
    Dieses Angebot richtet sich vor allem an Personen, die für ihre Recherchen exakte
    textuelle Übereinstimmungen suchen und große Mengen an Ergebnissen schnell sichten möchten.
    Die hierfür benötigten Erschließungsinformationen stammen aus dem
    <a href="https://www.bundesarchiv.de/DE/Content/Artikel/Ueber-uns/Aus-unserer-Arbeit/open-data.html">Open-Data-Angebot</a>
    des Bundesarchivs.
  search_intro_alternatives_html: >-
    Weitere Optionen für die Suche in den Beständen des Bundesarchivs sind
    <a href="https://www.archivesportaleurope.net">Archives Portal Europe</a>,
    <a href="https://www.archivportal-d.de">Archivportal-D</a> und
    <a href="https://invenio.bundesarchiv.de">Invenio</a>.
    Invenio ist ein Angebot des Bundesarchivs und ist bei Treffern in Bundessuche verlinkt.
    Dort kann das Archivgut eingesehen und bestellt werden.
