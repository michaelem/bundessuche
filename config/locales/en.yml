# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  about_title: "About us"
  about_project_html: >-
    Bundessuche is a project by <a href="https://emi.industries">Michael Emhofer</a>
    and offers a simple and fast way to search the holdings of the German Federal Archive.
    It is aimed above all at people looking for exact textual matches in their research
    who want to skim large numbers of results quickly.
    The finding aid information behind it comes from the Federal Archive's
    <a href="https://www.bundesarchiv.de/DE/Content/Artikel/Ueber-uns/Aus-unserer-Arbeit/open-data.html">open data programme</a>
  about_alternatives_html: >-
    Other options for searching the holdings of the German Federal Archive are
    <a href="https://www.archivesportaleurope.net">Archives Portal Europe</a>,
    <a href="https://www.archivportal-d.de">Archivportal-D</a> and
    <a href="https://invenio.bundesarchiv.de">Invenio</a>
    (which is linked directly from Bundessuche, to view and order the archival objects themselves).
  cite_copied: "%{name} copied"
  cite_copy: "Copy %{name} to the clipboard"
  cite_copy_failed: "Copying is not possible"
  cite_download: "Download %{name} file"
